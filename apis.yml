aid: beam
name: Beam
description: 'Beam is a construction financial management platform for residential
  and commercial contractors, headquartered in San Francisco. Its cloud software unifies
  estimating and proposals, progress invoicing with online payment collection, job
  costing and real-time profitability, expense management via the Beam Card, bill-pay
  automation, lien-waiver and compliance tracking, project management (daily logs,
  scheduling, change orders), and a cash-management account that earns cash back.
  Beam integrates with QuickBooks Online, CompanyCam, RenoFi and XactRemodel, and relies
  on vetted partners including Stripe, Footprint and CapitalOS for payments and KYC/KYB.
  Beam does not currently publish a public developer API, documentation surface, or
  SDKs; this profile captures its identity and security posture.'
